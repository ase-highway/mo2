<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, target-densitydpi=medium-dpi, user-scalable=yes, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no" />
  <title></title>

  <link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.min.css">
  <link type="text/css" rel="stylesheet" href="../js/swiper/swiper-bundle.min.css" />
  <link type="text/css" rel="stylesheet" href="../css/style.css" />
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="../js/swiper/swiper-bundle.min.js"></script>
  <script src="../js/jquery-ui/jquery-ui.min.js"></script>
  <script src="../js/ui.js"></script>

</head>



<body>

  <!-- wrap -->
  <div class="wrap">
    <script>
      $.get("common/header.html", function (data) {
        $(data).prependTo(".wrap");
      });
    </script>
    <div class="title-main-wrap">
      <div class="title">
        <div class="left">
          <button type="button" class="btn-prev"></button>
        </div>
        <h1 class="title-main">회원정보 변경</h1>
      </div>
    </div>
    <!-- container -->
    <div class="container">
      <main class="content">
        <div class="join-form-wrap type-member-modify">
          <div class="title-section">
            <h2 class="tit"><span>기본정보</span></h2>
          </div>
          <div class="form-wrap">
            <div class="col">
              <div class="label">아이디<span class="star">*</span></div>
              <div class="form">
                <input type="text" class="full" value="010-0000-0000" disabled readonly>
              </div>
            </div>
            <div class="col">
              <div class="label">새 비밀번호</div>
              <div class="form">
                <input type="password" class="full">
              </div>
            </div>
            <div class="col">
              <div class="label">새 비밀번호 확인</div>
              <div class="form">
                <input type="password" class="full">
              </div>
            </div>
            <div class="col">
              <div class="label">이름</div>
              <div class="form">
                <input type="text" class="full" value="홍길동" disabled readonly>
              </div>
            </div>
            <div class="col">
              <div class="label">휴대폰번호</div>
              <div class="form">
                <input type="text" class="full" value="010-0000-0000" disabled readonly>
                <div class="block">
                  <label class="inp-chk">
                    <input type="checkbox" checked>
                    <span class="ic"></span>
                    <span class="t">정보/이벤트 SMS 수신에 동의합니다.</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="label">주소<span class="star">*</span></div>
              <div class="form">
                <div class="inp-address">
                  <div class="row">
                    <input type="text" class="auto" value="16944" disabled readonly>
                    <button type="button" class="btn-type2 st7">우편번호 검색</button>
                  </div>
                  <div class="row">
                    <input type="text" class="auto" value="경기도 용인시 수지구" disabled readonly>
                  </div>
                  <div class="row">
                    <input type="text" class="auto" value="101동 1004호">
                  </div>
                  <div class="row">
                    <p class="txt-noti">XX점 배송 가능 지역입니다.</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-divider"></div>

            <div class="col">
              <div class="label">부가 정보</div>
              <div class="form">
                <div class="row birth-row">
                  <select class="birth-year">
                    <option>년도</option>
                    <option>1980</option>
                    <option>1981</option>
                  </select>
                  <select class="birth-month">
                    <option>월</option>
                    <option>1</option>
                    <option>2</option>
                  </select>
                  <select class="birth-day">
                    <option>일</option>
                    <option>1</option>
                    <option>2</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <!-- // form-wrap -->
        </div>
        <!-- // join-form-wrap -->

        <div class="btn-wrap type-member-modify">
          <button type="button" class="btn-type1 st1 full">확인</button>
        </div>
      </main>
      <!-- // content -->
    </div>
    <!-- // container -->

    <script>
      $.get("common/footer.html", function (data) {
        $(data).appendTo(".wrap");
      });
    </script>
  </div>

  <!-- // wrap -->




</body>

</html>
